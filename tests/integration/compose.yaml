services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ferrytest
      POSTGRES_PASSWORD: ferrytest
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ferrytest"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ferrytest
      MYSQL_ROOT_PASSWORD: ferrytest
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pferrytest --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ferrytest
      MARIADB_ROOT_PASSWORD: ferrytest
    ports:
      - "53307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_PASSWORD: ferrytest
    ports:
      - "58123:8123"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=default --password=ferrytest --query 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 40
